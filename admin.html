<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Indian AI Factory</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">

    <!-- Admin Login Screen -->
    <div id="admin-login-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center border border-slate-200">
            <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">Admin Portal</h2>
            <p class="text-xs text-slate-500 mb-6">Indian AI Factory Management</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="text-xs font-semibold text-slate-600">Master PIN</label>
                    <input type="password" id="admin-pin" placeholder="Enter PIN (Default: 9999)" class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button onclick="verifyAdminPin()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition shadow-md">
                    Login Karein
                </button>
            </div>
        </div>
    </div>

    <!-- Admin Main Dashboard -->
    <div id="admin-dashboard" class="hidden">
        <!-- Top Navigation -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">
                        IAF
                    </span>
                    <div>
                        <h1 class="text-base font-bold text-slate-800 leading-tight">Indian AI Factory - Admin Panel</h1>
                        <p class="text-[11px] text-slate-500 leading-none">Subscription & Access Control</p>
                    </div>
                </div>
                <button onclick="adminLogout()" class="text-xs text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto px-4 py-6">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Total Requests</p>
                    <h3 class="text-2xl font-bold text-slate-800 mt-1" id="stat-total-requests">0</h3>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Approved Users</p>
                    <h3 class="text-2xl font-bold text-emerald-600 mt-1" id="stat-approved-requests">0</h3>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Pending Requests</p>
                    <h3 class="text-2xl font-bold text-amber-500 mt-1" id="stat-pending-requests">0</h3>
                </div>
            </div>

            <!-- Request Table -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-users text-indigo-600"></i> User Access Requests
                    </h3>
                    <button onclick="loadRequests()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border transition">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Refresh List
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-600">
                        <thead class="bg-slate-50 border-b border-slate-200 text-slate-700 font-semibold uppercase">
                            <tr>
                                <th class="p-3">User Details</th>
                                <th class="p-3">Device Code</th>
                                <th class="p-3">Amount</th>
                                <th class="p-3">Request Date</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="request-table-body" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="6" class="p-4 text-center text-slate-400">Loading requests...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Admin Logic -->
    <script>
        const ADMIN_PIN = "9999";

        function verifyAdminPin() {
            const entered = document.getElementById('admin-pin').value;
            if (entered === ADMIN_PIN) {
                document.getElementById('admin-login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadRequests();
            } else {
                alert('Galat PIN! Kripya sahi master PIN enter karein.');
            }
        }

        function adminLogout() {
            document.getElementById('admin-login-modal').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-pin').value = '';
        }

        function loadRequests() {
            const reqs = JSON.parse(localStorage.getItem('iaf_all_requests') || '[]');
            const tbody = document.getElementById('request-table-body');
            
            document.getElementById('stat-total-requests').innerText = reqs.length;
            document.getElementById('stat-approved-requests').innerText = reqs.filter(r => r.status === 'approved').length;
            document.getElementById('stat-pending-requests').innerText = reqs.filter(r => r.status === 'pending').length;

            if (reqs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Abhi koi requests nahi hain.</td></tr>`;
                return;
            }

            tbody.innerHTML = reqs.map(r => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3">
                        <div class="font-medium text-slate-800">${r.name || 'Anonymous'}</div>
                        <div class="text-[11px] text-slate-400">${r.phone || 'N/A'}</div>
                    </td>
                    <td class="p-3 font-mono text-[11px] text-slate-600">${r.deviceId}</td>
                    <td class="p-3 font-semibold text-slate-700">₹${r.amount || 199}</td>
                    <td class="p-3 text-slate-500">${r.date || 'N/A'}</td>
                    <td class="p-3">
                        ${r.status === 'approved' 
                            ? '<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-semibold text-[10px]">Approved</span>'
                            : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-semibold text-[10px]">Pending</span>'
                        }
                    </td>
                    <td class="p-3 text-center space-x-1">
                        ${r.status !== 'approved' ? `
                            <button onclick="updateStatus('${r.deviceId}', 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-[11px] transition">
                                <i class="fa-solid fa-check mr-1"></i> Approve
                            </button>
                        ` : `
                            <button onclick="updateStatus('${r.deviceId}', 'pending')" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded text-[11px] transition">
                                <i class="fa-solid fa-ban mr-1"></i> Revoke
                            </button>
                        `}
                    </td>
                </tr>
            `).join('');
        }

        function updateStatus(deviceId, newStatus) {
            let reqs = JSON.parse(localStorage.getItem('iaf_all_requests') || '[]');
            reqs = reqs.map(r => {
                if (r.deviceId === deviceId) {
                    return { ...r, status: newStatus };
                }
                return r;
            });
            localStorage.setItem('iaf_all_requests', JSON.stringify(reqs));
            loadRequests();
            alert(`Device ${deviceId} status badalkar '${newStatus}' kar diya gaya hai.`);
        }
    </script>
</body>
</html>
